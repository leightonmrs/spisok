<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Хочу прочитать</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Хочу прочитать</h1>
    <form id="book-form" class="panel">
      <label for="title">Название</label>
      <input id="title" name="title" required>
      <label for="author">Автор (необязательно)</label>
      <input id="author" name="author">
      <label for="book-type">Тип</label>
      <select id="book-type" name="type">
        <option value="">Тип не указан</option>
        <option value="print">Печатная книга</option>
        <option value="ebook">Электронная книга</option>
        <option value="audio">Аудиокнига</option>
      </select>
      <button type="submit">Добавить</button>
    </form>
    <p id="status" role="status"></p>

    <form id="view-options" class="panel view-options" aria-label="Фильтры и сортировка">
      <div>
        <label for="filter-type">Тип</label>
        <select id="filter-type">
          <option value="">Все типы</option>
          <option value="unspecified">Не указан</option>
        </select>
      </div>
      <div>
        <label for="filter-rating">Оценка</label>
        <select id="filter-rating">
          <option value="">Все оценки</option>
          <option value="unrated">Не оценено</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div>
        <label for="filter-status">Статус</label>
        <select id="filter-status">
          <option value="">Все статусы</option>
          <option value="to-read">Хочу прочитать</option>
          <option value="reading">Читаю</option>
          <option value="read">Прочитано</option>
        </select>
      </div>
      <div>
        <label for="sort-books">Сортировка</label>
        <select id="sort-books">
          <option value="">По добавлению</option>
          <option value="type">По типу</option>
          <option value="rating-desc">Сначала высокие оценки</option>
          <option value="rating-asc">Сначала низкие оценки</option>
          <option value="status">По статусу</option>
        </select>
      </div>
      <button type="reset">Сбросить</button>
    </form>
    <p id="no-results" class="panel" role="status" hidden>По выбранным фильтрам книг нет</p>

    <div class="shelves">
      <section class="panel" aria-labelledby="to-read-heading">
        <h2 id="to-read-heading">Хочу прочитать</h2>
        <p id="to-read-empty" class="empty">Список пока пуст.</p>
        <ul id="to-read"></ul>
      </section>
      <section class="panel" aria-labelledby="reading-heading">
        <h2 id="reading-heading">Читаю</h2>
        <p id="reading-empty" class="empty">Пока нет начатых книг.</p>
        <ul id="reading"></ul>
      </section>
      <section class="panel" aria-labelledby="read-heading">
        <h2 id="read-heading">Прочитано</h2>
        <p id="read-empty" class="empty">Пока нет прочитанных книг.</p>
        <ul id="read"></ul>
      </section>
    </div>
    <div class="panel backup">
      <button type="button" id="download-backup">Скачать копию</button>
      <button type="button" id="choose-backup">Выбрать копию</button>
      <input type="file" id="backup-file" accept=".json,application/json" hidden>
      <p id="backup-preview" role="status" hidden></p>
      <fieldset id="backup-matches" hidden>
        <legend>Совпадения</legend>
        <p>Отметьте записи, которые хотите добавить.</p>
        <div id="backup-match-options"></div>
      </fieldset>
      <button type="button" id="add-from-backup" hidden>Добавить из копии</button>
      <button type="button" id="replace-from-backup" hidden>Заменить список</button>
    </div>
  </main>
</body>
</html>
